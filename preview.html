<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preview Interativo — GameApp RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #090a0f;
      color: #f1f3f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Barra Superior de Ferramentas de Teste */
    .preview-toolbar {
      width: 100%;
      max-width: 440px;
      padding: 10px 16px;
      background: #141722;
      border: 1px solid #232838;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .preview-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #3b82f6;
      font-weight: 700;
    }

    .preview-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .preview-tip {
      color: #8b95a8;
      font-size: 11px;
    }

    /* Moldura Mobile do Jogo */
    .mobile-frame {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 720px;
      max-height: 90vh;
      background-color: #12141c;
      border: 1px solid #232838;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* ---- TELA INICIAL (StartScreen) ---- */
    .start-screen {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 36px 24px 20px;
      background-color: #12141c;
    }

    /* Cabeçalho */
    .start-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 16px;
      gap: 8px;
    }

    .start-header-icon {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background-color: #1c202d;
      border: 1px solid #2d3345;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
      margin-bottom: 6px;
    }

    .start-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .start-subtitle {
      font-size: 13px;
      color: #8b95a8;
      font-weight: 500;
    }

    /* Conteúdo Central */
    .start-main {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .start-menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Botões Planos */
    .start-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, transform 0.08s ease;
      font-family: inherit;
    }

    .start-btn:active {
      transform: scale(0.98);
    }

    .start-btn.btn-primary {
      background-color: #3b82f6;
      color: #ffffff;
    }

    .start-btn.btn-primary:hover {
      background-color: #2563eb;
    }

    .start-btn.btn-secondary {
      background-color: #1c202d;
      color: #f1f3f7;
      border-color: #2d3345;
    }

    .start-btn.btn-secondary:hover {
      background-color: #242a3a;
    }

    /* Rodapé Visível com Destaque Super Suave */
    .start-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .footer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .footer-icon {
      color: #3b82f6;
      opacity: 0.85;
      display: flex;
      align-items: center;
    }

    .footer-text {
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
    }

    /* Feedback de clique / Toast */
    .toast-msg {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: #1e2433;
      border: 1px solid #3b82f6;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 99;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Barra de Ferramentas de Teste -->
  <div class="preview-toolbar">
    <div class="preview-badge">
      <div class="preview-dot"></div>
      <span>Tela 1: Tela Inicial</span>
    </div>
    <span class="preview-tip">Ambiente de Teste Local Rápido</span>
  </div>

  <!-- Moldura Mobile do Jogo -->
  <div class="mobile-frame">
    <div class="start-screen">
      <!-- Cabeçalho -->
      <header class="start-header">
        <div class="start-header-icon">
          <!-- Ícone SVG Shield -->
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <h1 class="start-title">Crônicas de Heróis</h1>
        <p class="start-subtitle">RPG Tático por Turnos</p>
      </header>

      <!-- Conteúdo Central com Botões Planos -->
      <main class="start-main">
        <div class="start-menu">
          <button type="button" class="start-btn btn-primary" id="btnContinue" onclick="showToast('Continuando jornada...')">
            <!-- Ícone SVG RotateCcw -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            <span>Continuar Jornada</span>
          </button>

          <button type="button" class="start-btn btn-secondary" id="btnNewGame" onclick="showToast('Iniciando novo jogo...')">
            <!-- Ícone SVG Swords -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
              <line x1="13" y1="19" x2="19" y2="13"/>
              <line x1="16" y1="16" x2="20" y2="20"/>
              <line x1="19" y1="21" x2="21" y2="19"/>
              <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/>
              <line x1="5" y1="14" x2="9" y2="18"/>
              <line x1="7" y1="17" x2="4" y2="20"/>
              <line x1="3" y1="19" x2="5" y2="21"/>
            </svg>
            <span>Novo Jogo</span>
          </button>
        </div>
      </main>

      <!-- Rodapé Visível com Destaque Super Suave -->
      <footer class="start-footer">
        <div class="footer-pill">
          <span class="footer-icon">
            <!-- Ícone SVG Sparkles -->
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
              <path d="M5 3v4"/>
              <path d="M19 17v4"/>
              <path d="M3 5h4"/>
              <path d="M17 19h4"/>
            </svg>
          </span>
          <span class="footer-text">Versão 1.0 • RPG Tático Mobile</span>
        </div>
      </footer>

      <!-- Toast para teste de cliques -->
      <div id="toast" class="toast-msg"></div>
    </div>
  </div>

  <script>
    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }
  </script>
</body>
</html>
