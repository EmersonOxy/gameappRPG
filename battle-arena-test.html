<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arena de Batalha — Teste (Fúria em Arco)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ======================================
   TEST PAGE — ARENA DE BATALHA (porta da interface React)
   Alteração: fúria do player vira ARCO em volta do ícone
   ====================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep:        #08090d;
  --bg-dark:        #0f1218;
  --bg-card:        #14181f;
  --bg-panel:       rgba(12, 14, 20, 0.94);
  --gold:           #c8993a;
  --gold-2:         #eab850;
  --gold-bright:    #ffd97a;
  --gold-dark:      #7a5518;
  --gold-dim:       rgba(200, 153, 58, 0.3);
  --teal:           #2dd4bf;
  --teal-dim:       rgba(45, 212, 191, 0.12);
  --crimson:        #b83030;
  --crimson-2:      #e05050;
  --text:           #e8dcc8;
  --text-dim:       rgba(232, 220, 200, 0.48);
  --text-bright:    #f5edd8;
  --border:         rgba(200, 153, 58, 0.15);
  --border-bright:  rgba(200, 153, 58, 0.38);
  --blue:           #4a90d9;
}

html, body { height: 100%; }

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #04050a;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.app-frame {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  background: var(--bg-deep);
  box-shadow:
    0 0 0 1px rgba(200, 153, 58, 0.1),
    0 0 80px rgba(0, 0, 0, 0.95),
    inset 0 0 100px rgba(0, 0, 0, 0.35);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.icon-svg { display: block; }

/* ---- Runic corner ornaments ---- */
.rune-corner {
  position: absolute;
  width: 60px;
  height: 60px;
  z-index: 2;
  pointer-events: none;
}
.rune-corner::before,
.rune-corner::after {
  content: "";
  position: absolute;
  background: var(--gold);
  opacity: 0.55;
}
.rune-corner.tl { top: 18px; left: 18px; }
.rune-corner.tr { top: 18px; right: 18px; transform: scaleX(-1); }
.rune-corner.bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
.rune-corner.br { bottom: 18px; right: 18px; transform: scale(-1); }
.rune-corner::before { top: 0; left: 0; width: 100%; height: 2px; }
.rune-corner::after  { top: 0; left: 0; width: 2px; height: 100%; }

.rune-divider {
  position: absolute;
  left: 56px; right: 56px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold-2) 50%, var(--gold) 70%, transparent);
  opacity: 0.35;
  z-index: 2;
  pointer-events: none;
}
.rune-divider.top    { top: 80px; }
.rune-divider.bottom { bottom: 80px; }

.rune-sep { display: flex; align-items: center; gap: 10px; width: 200px; }
.rune-sep-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim)); }
.rune-sep-line.right { background: linear-gradient(90deg, var(--gold-dim), transparent); }
.rune-sep-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); opacity: 0.7; }

.rune-emblem {
  position: relative;
  width: 90px;
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.rune-emblem-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--gold);
  opacity: 0.7;
  animation: ringPulse 3s ease-in-out infinite;
}
.rune-emblem-ring.inner { inset: 8px; border-color: var(--gold-2); opacity: 0.4; animation-delay: 1s; }
.rune-emblem-icon {
  font-size: 38px;
  filter: drop-shadow(0 0 12px rgba(200, 153, 58, 0.7));
  animation: iconFloat 4s ease-in-out infinite;
}
@keyframes ringPulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50%       { opacity: 0.85; transform: scale(1.04); }
}
@keyframes iconFloat {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-4px); }
}

/* ======================================
   BATTLE SCREEN
   ====================================== */
.battle-screen {
  flex: 1;
  position: relative;
  overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse 80% 60% at 50% 40%, #1c1408 0%, #08090d 60%, #000 100%);
}
.battle-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 20%, rgba(200, 153, 58, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse 80% 80% at 50% 100%, rgba(10, 6, 2, 0.7) 0%, transparent 60%);
  pointer-events: none;
  z-index: 1;
}
.battle-screen::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.75) 100%);
  pointer-events: none;
  z-index: 1;
}

.battle-divider {
  position: absolute;
  top: 50%;
  left: 20px; right: 20px;
  height: 1px;
  transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold-2) 50%, var(--gold) 70%, transparent);
  opacity: 0.35;
  z-index: 1;
  pointer-events: none;
}
.battle-divider::before {
  content: "✦";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 10px;
  color: var(--gold);
  background: var(--bg-deep);
  padding: 0 8px;
}

.timer-wrap {
  position: absolute;
  top: 14px;
  left: 20px; right: 20px;
  height: 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--border);
  overflow: hidden;
  z-index: 6;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
}
.timer-fill {
  height: 100%;
  background: linear-gradient(90deg, #2cc96e, #7de84d);
  transition: width 0.12s linear;
  box-shadow: 0 0 8px rgba(44, 201, 110, 0.4);
}
.timer-fill.danger {
  background: linear-gradient(90deg, #c0392b, #e74c3c);
  box-shadow: 0 0 10px rgba(192, 57, 43, 0.55);
  animation: timerDangerPulse 0.6s ease-in-out infinite;
}
@keyframes timerDangerPulse {
  0%, 100% { box-shadow: 0 0 8px rgba(192, 57, 43, 0.5); }
  50%       { box-shadow: 0 0 18px rgba(231, 76, 60, 0.85); }
}

/* ---- Enemy zone ---- */
.enemy-wrap {
  position: absolute;
  top: 46px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 3;
  transition: top 0.85s cubic-bezier(0.22, 1, 0.36, 1), transform 0.2s ease;
}
.enemy-wrap.attacking {
  top: calc(50% - 220px);
  transform: translateX(-50%) scale(1.03);
}

.threat-badge {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold-2);
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 999px;
  white-space: nowrap;
}

/* ---- Sprites ---- */
.sprite { display: flex; align-items: center; justify-content: center; }

.enemy-sprite {
  position: relative;
  width: 116px;
  height: 116px;
  border-radius: 4px;
  background: linear-gradient(160deg, #1e0f0f 0%, #120808 100%);
  border: 2px solid rgba(139, 28, 28, 0.6);
  color: #d97070;
  box-shadow:
    0 0 0 1px rgba(80, 10, 10, 0.6),
    0 0 30px rgba(139, 28, 28, 0.2),
    0 20px 50px rgba(0, 0, 0, 0.7),
    inset 0 1px 0 rgba(255, 80, 80, 0.06);
  padding: 14px;
}
.enemy-sprite::after {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 6px;
  background: transparent;
  box-shadow: 0 0 20px rgba(192, 57, 43, 0.25);
  animation: enemyAuraPulse 2.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes enemyAuraPulse {
  0%, 100% { box-shadow: 0 0 16px rgba(192, 57, 43, 0.2); }
  50%       { box-shadow: 0 0 32px rgba(192, 57, 43, 0.5); }
}
.enemy-sprite::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 6px;
  background:
    linear-gradient(135deg, rgba(200,153,58,0.4) 0%, transparent 25%) top left / 18px 18px no-repeat,
    linear-gradient(225deg, rgba(200,153,58,0.4) 0%, transparent 25%) top right / 18px 18px no-repeat,
    linear-gradient(315deg, rgba(200,153,58,0.4) 0%, transparent 25%) bottom left / 18px 18px no-repeat,
    linear-gradient(45deg, rgba(200,153,58,0.4) 0%, transparent 25%) bottom right / 18px 18px no-repeat;
  pointer-events: none;
}

.player-sprite {
  position: relative;
  width: 100px;
  height: 100px;
  border-radius: 4px;
  background: linear-gradient(160deg, #0f1a2e 0%, #080f1e 100%);
  border: 2px solid rgba(45, 80, 160, 0.55);
  color: #7aade0;
  box-shadow:
    0 0 0 1px rgba(10, 20, 60, 0.6),
    0 0 24px rgba(45, 100, 200, 0.15),
    0 18px 46px rgba(0, 0, 0, 0.65),
    inset 0 1px 0 rgba(100, 160, 255, 0.06);
  padding: 12px;
}
.player-sprite::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 6px;
  background:
    linear-gradient(135deg, rgba(200,153,58,0.35) 0%, transparent 25%) top left / 16px 16px no-repeat,
    linear-gradient(225deg, rgba(200,153,58,0.35) 0%, transparent 25%) top right / 16px 16px no-repeat,
    linear-gradient(315deg, rgba(200,153,58,0.35) 0%, transparent 25%) bottom left / 16px 16px no-repeat,
    linear-gradient(45deg, rgba(200,153,58,0.35) 0%, transparent 25%) bottom right / 16px 16px no-repeat;
  pointer-events: none;
}

.player-sprite-holder {
  position: absolute;
  left: 50%;
  bottom: 172px;
  transform: translateX(-50%);
  z-index: 2;
  transition: bottom 0.85s cubic-bezier(0.22, 1, 0.36, 1);
}
.player-sprite-holder.attacking {
  bottom: calc(50% - 104px);
  transform: translateX(-50%) scale(1.03);
}

/* ======================================
   NOVO — BARRA DE FÚRIA EM ARCO
   Arco de 180° no lado direito do ícone do player
   ====================================== */
.fury-arc {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 140px;
  height: 140px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 6;
}
.fury-arc svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.fury-track-outer {
  fill: none;
  stroke: rgba(240, 117, 31, 0.14);
  stroke-width: 12;
  stroke-linecap: round;
}
.fury-track {
  fill: none;
  stroke: rgba(20, 22, 30, 0.95);
  stroke-width: 8;
  stroke-linecap: round;
}
.fury-fill {
  fill: none;
  stroke: url(#furyGrad);
  stroke-width: 7;
  stroke-linecap: round;
  transition: stroke-dasharray 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  filter: drop-shadow(0 0 5px rgba(255, 169, 77, 0.55));
}
.fury-arc.full .fury-fill {
  animation: furyGlow 1.2s ease-in-out infinite;
}
@keyframes furyGlow {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 169, 77, 0.5)); }
  50%       { filter: drop-shadow(0 0 14px rgba(255, 190, 90, 0.95)); }
}
.fury-tick {
  stroke: #2a3038;
  stroke-width: 2;
}
.fury-chip {
  position: absolute;
  transform: translate(-50%, -50%);
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, #3a2410, #1e1206);
  border: 1px solid rgba(240, 117, 31, 0.55);
  color: #ffb37a;
  font-size: 10px;
  font-weight: 900;
  box-shadow: 0 0 10px rgba(240, 117, 31, 0.35);
  transition: left 0.35s ease, top 0.35s ease;
  white-space: nowrap;
  z-index: 7;
}
.fury-chip.full {
  animation: furyChipPulse 1.2s ease-in-out infinite;
}
@keyframes furyChipPulse {
  0%, 100% { box-shadow: 0 0 8px rgba(240, 117, 31, 0.35); }
  50%       { box-shadow: 0 0 18px rgba(255, 190, 90, 0.85); }
}

/* ---- Flash effects ---- */
.block-flash {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  color: var(--gold-bright);
  filter: drop-shadow(0 0 16px rgba(200, 153, 58, 0.9));
  z-index: 4;
}
.block-flash.show { display: flex; animation: blockPop 0.44s cubic-bezier(0.2, 0.9, 0.3, 1); }
@keyframes blockPop {
  0%   { transform: scale(0.3); opacity: 0; }
  60%  { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.miss-flash, .crit-flash, .stun-flash, .skill-flash {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  pointer-events: none;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1px;
  opacity: 0;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
}
.miss-flash.show, .crit-flash.show, .stun-flash.show, .skill-flash.show { opacity: 1; animation: missPop 0.42s ease; }
.miss-flash { color: #ff9090; }
.crit-flash, .skill-flash, .stun-flash { animation-name: critPop; }
@keyframes missPop {
  0%   { transform: translateY(-50%) scale(0.5); opacity: 0; }
  60%  { transform: translateY(-50%) scale(1.15); opacity: 1; }
  100% { transform: translateY(-50%) scale(1); opacity: 1; }
}
@keyframes critPop {
  0%   { transform: translateY(-50%) scale(0.4); opacity: 0; }
  50%  { transform: translateY(-50%) scale(1.3); opacity: 1; }
  100% { transform: translateY(-50%) scale(1); opacity: 1; }
}
.crit-flash { color: var(--gold-bright); }
.stun-flash { color: #9fe8ff; }
.miss-flash.left, .crit-flash.left, .stun-flash.left, .skill-flash.left { right: calc(100% + 12px); }
.miss-flash.right, .crit-flash.right { left: calc(100% + 12px); }
.skill-flash.branch-fogo    { color: #ffb09a; }
.skill-flash.branch-sagrado { color: #8ff5e4; }
.skill-flash.branch-gelo    { color: #a8d4ff; }

.shield-badge {
  position: absolute;
  top: -8px;
  left: -8px;
  display: none;
  align-items: center;
  gap: 3px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 900;
  color: #06282b;
  background: linear-gradient(180deg, #7fe8dc, #2dd4bf);
  border: 1px solid #0e5a52;
  box-shadow: 0 0 12px rgba(45, 212, 191, 0.5);
  z-index: 5;
  animation: blockPop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.shield-badge.show { display: flex; }

/* ---- Player stats bar ---- */
.player-wrap {
  position: absolute;
  bottom: 24px;
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  z-index: 2;
  padding: 0 22px;
}

/* ---- Vertical resource stacks ---- */
.arena-stack {
  position: absolute;
  display: flex;
  gap: 6px;
  z-index: 3;
}
.arena-stack.left  { left: 14px; }
.arena-stack.right { right: 14px; }
.arena-stack.player {
  bottom: 150px;
  top: calc(50% + 16px);
  align-items: flex-end;
}
.arena-stack.enemy {
  top: 48px;
  bottom: calc(50% + 16px);
  align-items: flex-start;
}
.arena-stack .vbar {
  width: 16px;
  min-height: 0;
}
.arena-stack .vbar.vida      { height: 100%; }
.arena-stack .vbar.estamina  { height: 72%; }
.arena-stack .vbar.furia     { height: 48%; }
.arena-stack .vbar.mana      { height: 48%; }
.arena-stack.player .vbar.mana { height: 72%; }

.vbar-inner {
  position: relative;
  width: 100%;
  height: 100%;
  background: #100b09;
  border: 1px solid rgba(200, 153, 58, 0.4);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.8),
    0 4px 12px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  border-radius: 2px;
  overflow: hidden;
}
.vbar-inner.shake { animation: healthShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
@keyframes healthShake {
  0%, 100% { transform: translateX(0); }
  20%       { transform: translateX(-6px); }
  40%       { transform: translateX(6px); }
  60%       { transform: translateX(-4px); }
  80%       { transform: translateX(4px); }
}

.bar-fill {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  transition: height 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}
.bar-fill.reverse { top: 0; bottom: auto; }
.bar-fill::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 35%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), transparent);
}
.bar-fill.hp      { background: linear-gradient(180deg, #e74c3c 0%, #c0392b 50%, #8b1c1c 100%); box-shadow: 0 0 12px rgba(231, 76, 60, 0.4); }
.bar-fill.estamina{ background: linear-gradient(180deg, #6fb1ff, #357abd); }
.bar-fill.furia   { background: linear-gradient(180deg, #ffa94d, #f0751f); }
.bar-fill.mana    { background: linear-gradient(180deg, #4dd0c1, #15858a); }

.bar-recent {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 8px #ffffff;
  transition: height 0.6s ease;
  z-index: 3;
}
.bar-recent.reverse { top: 0; bottom: auto; }

.bar-tick {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  z-index: 2;
}

/* ---- Action buttons ---- */
.battle-actions {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  width: 100%;
  max-width: 460px;
}
.battle-skills {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 460px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 1px 1px 3px;
  scrollbar-width: none;
}
.battle-skills::-webkit-scrollbar { display: none; }
.battle-skills .btn-action { flex: 0 0 auto; min-width: 118px; padding: 0 10px; }

.btn-action {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0 4px;
  height: 52px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  transition: transform 0.06s ease, box-shadow 0.08s ease, opacity 0.15s ease;
}
.btn-action:disabled { opacity: 0.38; cursor: default; }
.btn-action.attack {
  background: linear-gradient(180deg, #d44030 0%, #8b1c1c 100%);
  box-shadow: 0 5px 0 #571010, 0 8px 24px rgba(180, 50, 30, 0.15), inset 0 1px 0 rgba(255, 130, 100, 0.2);
}
.btn-action.defend {
  background: linear-gradient(180deg, #2a7a84 0%, #164850 100%);
  box-shadow: 0 5px 0 #0d3038, 0 8px 24px rgba(30, 120, 140, 0.12), inset 0 1px 0 rgba(80, 200, 220, 0.15);
}
.btn-action.special {
  background: linear-gradient(180deg, var(--gold-2) 0%, #8a5a10 100%);
  box-shadow: 0 5px 0 #4a3008, 0 8px 24px rgba(200, 153, 58, 0.12), inset 0 1px 0 rgba(255, 220, 120, 0.25);
}
.btn-action.skill.branch-fogo {
  background: linear-gradient(180deg, #d44030 0%, #8b1c1c 100%);
  box-shadow: 0 5px 0 #571010, 0 8px 24px rgba(180, 50, 30, 0.15), inset 0 1px 0 rgba(255, 130, 100, 0.2);
}
.btn-action.skill.branch-sagrado {
  background: linear-gradient(180deg, #2dd4bf 0%, #0e7a72 100%);
  box-shadow: 0 5px 0 #08423c, 0 8px 24px rgba(45, 212, 191, 0.12), inset 0 1px 0 rgba(140, 245, 228, 0.2);
}
.btn-action.skill.branch-gelo {
  background: linear-gradient(180deg, #4a90d9 0%, #1f4a7a 100%);
  box-shadow: 0 5px 0 #122e4d, 0 8px 24px rgba(70, 140, 220, 0.15), inset 0 1px 0 rgba(140, 200, 255, 0.2);
}
.btn-action.special:not(:disabled) { animation: specialReady 1.8s ease-in-out infinite; }
@keyframes specialReady {
  0%, 100% { box-shadow: 0 5px 0 #4a3008, 0 8px 24px rgba(200, 153, 58, 0.1), inset 0 1px 0 rgba(255, 220, 120, 0.2); }
  50%       { box-shadow: 0 5px 0 #4a3008, 0 12px 40px rgba(234, 184, 80, 0.35), inset 0 1px 0 rgba(255, 220, 120, 0.3); }
}
.btn-action:not(:disabled):active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5) !important; animation: none; }

.skill-btn-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 66px; }
.skill-cost {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  font-weight: 900;
  color: #cfefff;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 999px;
  padding: 2px 6px;
  flex-shrink: 0;
}

.btn-action.bag {
  gap: 3px;
  font-size: 9.5px;
  letter-spacing: 0.3px;
  background: linear-gradient(180deg, #7a5fd0 0%, #4a3480 100%);
  box-shadow: 0 5px 0 #2a1a4a, 0 8px 24px rgba(122, 95, 208, 0.15), inset 0 1px 0 rgba(180, 150, 255, 0.2);
}
.bag-crystals {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 8.5px;
  font-weight: 900;
  color: #e6dbff;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 999px;
  padding: 1px 2px;
  flex-shrink: 0;
}

/* ---- Pending items chips ---- */
.pending-items {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 7;
}
.pending-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  color: var(--text-bright);
  background: rgba(10, 10, 16, 0.85);
  border: 1px solid var(--border-bright);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
  animation: chipIn 0.3s ease both;
}
.pending-chip.branch-furia, .pending-chip.branch-dano { color: #ffb09a; border-color: rgba(212, 64, 48, 0.5); }
.pending-chip.branch-vida { color: #ff9d8a; border-color: rgba(212, 64, 48, 0.5); }
.pending-chip.branch-mana, .pending-chip.branch-escudo { color: #8ff5e4; border-color: rgba(45, 212, 191, 0.4); }
.pending-chip.branch-estamina { color: #a8d4ff; border-color: rgba(90, 150, 220, 0.45); }
.pending-count {
  min-width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 9px;
  font-weight: 900;
  color: #1a0d00;
  background: var(--gold-bright);
}
@keyframes chipIn {
  0%   { transform: translateY(10px) scale(0.9); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

/* ---- Item activation popup ---- */
.item-popup {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  border-radius: 6px;
  color: var(--text-bright);
  background: rgba(10, 10, 16, 0.94);
  border: 1px solid var(--gold);
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 24px rgba(200, 153, 58, 0.35);
  z-index: 22;
  animation: itemPopupIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.item-popup.show { display: flex; }
.item-popup.branch-vida, .item-popup.branch-furia, .item-popup.branch-dano { border-color: rgba(212, 64, 48, 0.6); }
.item-popup.branch-mana, .item-popup.branch-escudo { border-color: rgba(45, 212, 191, 0.6); }
.item-popup.branch-estamina { border-color: rgba(90, 150, 220, 0.6); }
.item-popup-text { display: flex; flex-direction: column; gap: 1px; }
.item-popup-name { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 900; letter-spacing: 1px; }
.item-popup-effect { font-size: 11px; font-weight: 700; color: var(--text); }
@keyframes itemPopupIn {
  from { opacity: 0; transform: translate(-50%, 12px) scale(0.94); }
  to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

/* ========================================
   RESULT OVERLAYS
   ======================================== */
.result-overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(5, 4, 8, 0.7) 0%, rgba(0, 0, 0, 0.92) 100%);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index:20;
  animation: overlayFadeIn 0.3s ease;
}
.result-overlay.show { display: flex; }
@keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }

.result-card {
  position: relative;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 36px 28px 28px;
  border-radius: 4px;
  background: linear-gradient(180deg, #18140e 0%, #0d0b08 100%);
  border: 1px solid rgba(200, 153, 58, 0.4);
  box-shadow:
    0 0 0 1px rgba(200, 153, 58, 0.08),
    0 30px 80px rgba(0, 0, 0, 0.8),
    inset 0 1px 0 rgba(200, 153, 58, 0.1);
  overflow: hidden;
  animation: cardSlideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes cardSlideIn {
  from { transform: translateY(20px) scale(0.97); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
.result-card::before {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: 4px;
  background:
    linear-gradient(135deg, rgba(200,153,58,0.5) 0%, transparent 20%) top left / 24px 24px no-repeat,
    linear-gradient(225deg, rgba(200,153,58,0.5) 0%, transparent 20%) top right / 24px 24px no-repeat,
    linear-gradient(315deg, rgba(200,153,58,0.5) 0%, transparent 20%) bottom left / 24px 24px no-repeat,
    linear-gradient(45deg, rgba(200,153,58,0.5) 0%, transparent 20%) bottom right / 24px 24px no-repeat;
  pointer-events: none;
}
.result-card::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-2) 30%, var(--gold-bright) 50%, var(--gold-2) 70%, transparent);
  opacity: 0.8;
}

.result-icon {
  position: relative;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.result-icon.win  { background: radial-gradient(circle at 35% 30%, #fff0b0, #c8993a 55%, #7a5518); color: #2a1a00; animation: iconGlowWin 2s ease-in-out infinite; }
.result-icon.lose { background: radial-gradient(circle at 35% 30%, #ffb0a0, #b83030 55%, #601010); color: #2a0000; animation: iconGlowLose 2s ease-in-out infinite; }
@keyframes iconGlowWin {
  0%, 100% { box-shadow: 0 0 0 6px rgba(200,153,58,0.08), 0 0 40px rgba(200,153,58,0.4); }
  50%       { box-shadow: 0 0 0 12px rgba(200,153,58,0.12), 0 0 70px rgba(234,184,80,0.65); }
}
@keyframes iconGlowLose {
  0%, 100% { box-shadow: 0 0 0 6px rgba(184,48,48,0.08), 0 0 38px rgba(184,48,48,0.4); }
  50%       { box-shadow: 0 0 0 12px rgba(184,48,48,0.12), 0 0 65px rgba(224,80,80,0.65); }
}
.result-title {
  font-family: 'Cinzel', serif;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 3px;
  text-align: center;
  text-transform: uppercase;
}
.result-title.win  { color: var(--gold-bright); text-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 0 28px rgba(200,153,58,0.6); }
.result-title.lose { color: #ff9090; text-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 0 28px rgba(220,80,80,0.6); }
.result-subtitle { font-size: 10px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: var(--text-dim); }
.reward-row { display: flex; gap: 10px; margin: 4px 0 8px; }
.reward-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 18px;
  border-radius: 3px;
  font-size: 15px;
  font-weight: 900;
  animation: chipIn 0.36s ease both;
}
.reward-chip:nth-child(2) { animation-delay: 0.08s; }
.reward-chip.gold {
  color: var(--gold-bright);
  background: linear-gradient(180deg, rgba(200,153,58,0.1), rgba(200,153,58,0.04));
  border: 1px solid rgba(200,153,58,0.3);
}
.reward-chip.xp {
  color: #b0deff;
  background: linear-gradient(180deg, rgba(60,140,220,0.08), rgba(60,140,220,0.03));
  border: 1px solid rgba(60,140,220,0.15);
}
.result-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 6px; }
.btn-result {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0;
  height: 48px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  color: var(--text);
  background: linear-gradient(180deg, #2a2318, #1a1610);
  border: 1px solid var(--border);
  box-shadow: 0 4px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  transition: transform 0.06s ease, filter 0.1s ease;
}
.btn-result:hover { filter: brightness(1.1); }
.btn-result:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.5); }
.btn-result.primary {
  color: #1a0d00;
  background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-2) 40%, var(--gold) 100%);
  border: none;
  box-shadow: 0 5px 0 var(--gold-dark), 0 10px 28px rgba(200, 153, 58, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  font-family: 'Cinzel', serif;
  font-size: 14px;
  letter-spacing: 2px;
}
.btn-result.primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-dark), 0 4px 12px rgba(200,153,58,0.15), inset 0 1px 0 rgba(255,255,255,0.15); }

/* ========================================
   DICE OVERLAY
   ======================================== */
.dice-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 44px 22px 40px;
  background:
    radial-gradient(ellipse 70% 50% at 50% 30%, rgba(200,153,58,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 100% 60% at 50% 100%, rgba(60,20,10,0.25) 0%, transparent 50%),
    linear-gradient(180deg, #1c1408 0%, #08090d 100%);
  z-index: 18;
  animation: overlayFadeIn 0.25s ease;
}
.dice-overlay.hidden { display: none; }
.dice-overlay::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,153,58,0.4) 30%, rgba(200,153,58,0.6) 50%, rgba(200,153,58,0.4) 70%, transparent);
}
.dice-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.dice-emblem { width: 72px; height: 72px; margin-bottom: 0; }
.dice-emblem .rune-emblem-icon { font-size: 28px; }
.dice-title {
  font-family: 'Cinzel', serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--text);
  text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}
.dice-header .rune-sep { width: 180px; }
.dice-subtitle { margin-top: 0; font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }
.dice-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  width: 100%;
}
.dice-holder { position: relative; z-index: 2; }
.dice-shadow {
  position: relative;
  z-index: 1;
  width: 140px;
  height: 28px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 0%, transparent 70%);
  filter: blur(5px);
}
.dice-shadow.animating { animation: shadowPulse 2.4s cubic-bezier(0.25, 0.8, 0.4, 1); }
@keyframes shadowPulse {
  0%   { transform: scale(0.45); opacity: 0.5; }
  22%  { transform: scale(0.3);  opacity: 0.35; }
  40%  { transform: scale(0.95); opacity: 0.85; }
  58%  { transform: scale(0.45); opacity: 0.5; }
  76%  { transform: scale(0.8);  opacity: 0.78; }
  90%  { transform: scale(0.58); opacity: 0.6; }
  100% { transform: scale(1);    opacity: 0.9; }
}
.dice-footer { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.luck-slot { height: 32px; display: flex; align-items: center; justify-content: center; }
.luck-label {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--gold-2);
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  padding: 6px 20px;
  border-radius: 3px;
}
.btn-roll {
  position: relative;
  padding: 0 52px;
  height: 52px;
  font-family: 'Cinzel', serif;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  color: #1a0d00;
  background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-2) 40%, var(--gold) 100%);
  box-shadow:
    0 5px 0 var(--gold-dark),
    0 10px 26px rgba(200, 153, 58, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
  transition: transform 0.07s ease, box-shadow 0.07s ease;
  overflow: hidden;
}
.btn-roll::after {
  content: "";
  position: absolute;
  top: 0; left: -70%;
  width: 45%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  animation: btnShimmer 3s ease infinite;
}
@keyframes btnShimmer {
  0%        { left: -70%; }
  40%, 100% { left: 130%; }
}
.btn-roll:disabled { opacity: 0.48; cursor: default; animation: none; }
.btn-roll:disabled::after { display: none; }
.btn-roll:not(:disabled):active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--gold-dark), 0 4px 10px rgba(200,153,58,0.15), inset 0 1px 0 rgba(255,255,255,0.15);
}
.btn-roll.hidden { display: none; }

/* 3D dice cube */
.dice-scene { width: 96px; height: 96px; perspective: 700px; }
.dice-scene.throwing { animation: throwBounce 2.4s cubic-bezier(0.25, 0.8, 0.4, 1); }
@keyframes throwBounce {
  0%   { transform: translateY(240px) scale(0.4); }
  22%  { transform: translateY(-30px) scale(1.15); }
  40%  { transform: translateY(16px) scale(0.96); }
  58%  { transform: translateY(-12px) scale(1.06); }
  76%  { transform: translateY(6px) scale(0.99); }
  90%  { transform: translateY(-3px) scale(1.02); }
  100% { transform: translateY(0) scale(1); }
}
.dice-cube { position: relative; width: 96px; height: 96px; transform-style: preserve-3d; }
.dice-face {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #f5edd8 0%, #e2d2b4 100%);
  border-radius: 8px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  padding: 14px;
  gap: 4px;
  border: 1px solid rgba(200, 153, 58, 0.6);
  box-shadow: inset 0 0 10px rgba(120, 85, 24, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  backface-visibility: hidden;
}
.face-front  { transform: translateZ(48px); }
.face-back   { transform: rotateY(180deg) translateZ(48px); }
.face-right  { transform: rotateY(90deg) translateZ(48px); }
.face-left   { transform: rotateY(-90deg) translateZ(48px); }
.face-top    { transform: rotateX(90deg) translateZ(48px); }
.face-bottom { transform: rotateX(-90deg) translateZ(48px); }
.pip-slot { display: flex; align-items: center; justify-content: center; }
.pip {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #7a5518, #3a2200);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
}

/* ========================================
   INVENTORY / MOCHILA
   ======================================== */
.bag-overlay {

  align-items: center;
  justify-content: center;
  padding: 22px;
  background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(5, 4, 8, 0.75) 0%, rgba(0, 0, 0, 0.94) 100%);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 30;
  animation: overlayFadeIn 0.25s ease;
}
.bag-overlay.show { display: flex; }
.bag-panel {
  width: 100%;
  max-width: 420px;
  max-height: 82%;

  flex-direction: column;
  gap: 12px;

.bag-close {

.crystal-pips .pip.full { color: #b5a6ff; filter: drop-shadow(0 0 6px rgba(160, 130, 255, 0.7)); }
.bag-crystals-note { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.bag-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.bag-item {

.bag-item-icon.branch-estamina { color: #a8d4ff; border-color: rgba(90, 150, 220, 0.45); background: rgba(90, 150, 220, 0.08); }

.bag-item-name { font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700; color: var(--text-bright); }
.bag-qty { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 800; color: var(--gold-bright); }
.bag-item-desc { font-size: 10px; line-height: 1.3; color: var(--text-dim); }
.bag-item-delay { font-size: 9px; font-weight: 700; color: var(--text-dim); }
.bag-use {

<div class="app-frame">

    <div class="rune-corner br"></div>

    <div class="timer-wrap"><div class="timer-fill" id="timerFill"></div></div>
    <div class="battle-divider"></div>

    <!-- Vertical bars — enemy (top half, mirrored) -->
    <div class="arena-stack left enemy">
      <div class="vbar furia"><div class="vbar-inner" id="enemyFuryBar"></div></div>
      <div class="vbar mana"><div class="vbar-inner" id="enemyManaBar"></div></div>
    </div>
    <div class="arena-stack right enemy">
      <div class="vbar vida"><div class="vbar-inner" id="enemyHpBar"></div></div>
      <div class="vbar estamina"><div class="vbar-inner" id="enemyStaminaBar"></div></div>
    </div>

    <!-- Vertical bars — player (bottom half) -->
    <div class="arena-stack left player">
      <div class="vbar vida"><div class="vbar-inner" id="playerHpBar"></div></div>
      <div class="vbar estamina"><div class="vbar-inner" id="playerStaminaBar"></div></div>
    </div>
    <div class="arena-stack right player">
      <div class="vbar mana"><div class="vbar-inner" id="playerManaBar"></div></div>
    </div>

    <!-- Enemy -->

        <div class="crit-flash left" id="enemyCritFlash">Crítico!</div>
        <div class="stun-flash left" id="enemyStunFlash">Congelado!</div>
        <div class="skill-flash left branch-fogo" id="enemySkillFlash"></div>

    </div>

    <!-- Player -->
    <div class="player-sprite-holder" id="playerHolder">
      <div class="sprite player-sprite">
        <svg class="icon-svg" width="56" height="56"><use href="#icon-user"/></svg>
        <div class="shield-badge" id="shieldBadge">
          <svg class="icon-svg" width="13" height="13"><use href="#icon-shield"/></svg>
          <span id="shieldValue">0</span>
        </div>
        <div class="block-flash" id="playerBlockFlash">
          <svg class="icon-svg" width="52" height="52"><use href="#icon-shield"/></svg>
        </div>
        <div class="miss-flash right" id="playerMissFlash">Errou!</div>
        <div class="crit-flash right" id="playerCritFlash">Crítico!</div>
      </div>

        <svg viewBox="0 0 140 140">
          <defs>
            <linearGradient id="furyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffa94d"/>

        </button>

      <div class="rune-corner tr"></div>
      <div class="rune-corner bl"></div>
      <div class="rune-corner br"></div>

          <svg class="icon-svg" width="42" height="42"><use href="#icon-trophy"/></svg>
        </div>

          <div class="rune-sep-line"></div>
          <div class="rune-sep-diamond"></div>
          <div class="rune-sep-line right"></div>
        </div>
        <p class="result-subtitle">Recompensas</p>

            <svg class="icon-svg" width="18" height="18"><use href="#icon-coins"/></svg>
            <span id="rewardGold">+0</span>
          </div>
          <div class="reward-chip xp">
            <svg class="icon-svg" width="18" height="18"><use href="#icon-sparkles"/></svg>
            <span id="rewardXp">+0 XP</span>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn-result" id="btnVictoryLeave">
            <svg class="icon-svg" width="18" height="18"><use href="#icon-logout"/></svg> Sair
          </button>
          <button class="btn-result primary" id="btnNextBattle">
            <svg class="icon-svg" width="18" height="18"><use href="#icon-swords"/></svg> Próximo combate
          </button>
        </div>
      </div>
    </div>

      <div class="rune-corner tl"></div>
      <div class="rune-corner tr"></div>
      <div class="rune-corner bl"></div>
      <div class="rune-corner br"></div>
      <div class="result-card">
        <div class="result-icon lose">
          <svg class="icon-svg" width="42" height="42"><use href="#icon-skull"/></svg>

        <div class="rune-sep">

          <div class="rune-sep-diamond"></div>
          <div class="rune-sep-line right"></div>

          <div class="reward-chip gold">
            <svg class="icon-svg" width="18" height="18"><use href="#icon-coins"/></svg>
            <span>+0</span>
          </div>
          <div class="reward-chip xp">
            <svg class="icon-svg" width="18" height="18"><use href="#icon-sparkles"/></svg>
            <span>+1 XP</span>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn-result" id="btnDefeatLeave">
            <svg class="icon-svg" width="18" height="18"><use href="#icon-logout"/></svg> Sair
          </button>

            <svg class="icon-svg" width="18" height="18"><use href="#icon-rotatecw"/></svg> Jogar novamente

          <span class="bag-crystals-note">recarrega a cada 2 turnos</span>
        </div>
        <div class="bag-list" id="bagList"></div>
      </div>
    </div>

  </div>
</div>

    { id: "pocao-vida",     name: "Poção de Vida",     crystalCost: 2, delay: 1, icon: "heart",    branch: "vida",     effect: { type: "heal", pct: 0.3 }, desc: "Cura 30% da vida máxima." },
    { id: "pocao-furia",    name: "Poção de Fúria",    crystalCost: 2, delay: 1, icon: "flame",    branch: "furia",    effect: { type: "fury", amount: 3 }, desc: "Ganha 3 de fúria." },
    { id: "pocao-escudo",   name: "Poção de Escudo",   crystalCost: 3, delay: 1, icon: "shield",   branch: "escudo",   effect: { type: "shield", amount: 4 }, desc: "Ganha um escudo que absorve dano." },
    { id: "bomba",          name: "Bomba",             crystalCost: 5, delay: 2, icon: "bomb",     branch: "dano",     effect: { type: "damage", base: 6 }, desc: "Explode após 2 turnos causando dano fixo." },
  ];

  const state = {
    phase: "dice",
    turn: 0,
    difficulty: 2,
    luck: null,
    playerHp: 30, playerMaxHp: 30, playerAtk: 9, playerDef: 6,
    playerStamina: 12, playerStaminaMax: 12,
    playerMana: 10, playerManaMax: 10,
    playerFury: 0, playerFuryMult: 2.5,
    playerShield: 0,
    enemyHp: 40, enemyMaxHp: 40, enemyAtk: 8, enemyDef: 5,
    enemyStamina: ENEMY_STAMINA_MAX,
    enemyMana: 6, enemyManaMax: 6,
    enemyFury: 0,
    crystals: CRYSTAL_MAX,
    timeLeft: MATCH_TIME,
    pending: [],
    itemsQty: { "pocao-mana": 1, "pocao-estamina": 1, "pocao-vida": 1, "pocao-furia": 1, "pocao-escudo": 1, "bomba": 1 },
    popupTimer: null,
  };

  const $ = (id) => document.getElementById(id);

  /* ================= DADOS / ROLLS ================= */
  const rollDamage = (atk, def) => Math.max(1, atk - def) * (0.8 + Math.random() * 0.3);
  const rollDie = () => 1 + Math.floor(Math.random() * 6);
  const missChance = (luck) => (6 - luck) * 0.05;
  const rollReward = (base, extra) => base + Math.floor(Math.random() * (extra + 1));
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  /* ================= BARRAS VERTICAIS ================= */
  const bars = {};

  function buildBar(id, kind, max, reverse) {
    const el = $(id);
    el.innerHTML = "";
    const fill = document.createElement("div");
    fill.className = "bar-fill " + kind + (reverse ? " reverse" : "");
    el.appendChild(fill);
    if (kind === "hp") {
      const recent = document.createElement("div");
      recent.className = "bar-recent" + (reverse ? " reverse" : "");
      recent.style.height = "0%";
      el.appendChild(recent);
    }
    const ticks = [];
    for (let i = 0; i < max; i++) {
      const t = document.createElement("span");
      t.className = "bar-tick";
      t.style[reverse ? "top" : "bottom"] = (i / max) * 100 + "%";
      t.style.background = kind === "hp" ? "rgba(0, 0, 0, 0.4)" : "#2a3038";
      el.appendChild(t);
      ticks.push(t);
    }
    bars[id] = { el, fill, recent: el.querySelector(".bar-recent"), ticks, max, reverse, kind };
  }

  function setBar(id, value, opts = {}) {
    const b = bars[id];
    const v = clamp(value, 0, b.max);
    const pct = (v / b.max) * 100;
    b.fill.style.height = pct + "%";
    if (b.kind === "hp") {
      const filledCount = Math.floor(v);
      b.ticks.forEach((t, i) => {
        t.style.background = i < filledCount ? "rgba(0, 0, 0, 0.4)" : "rgba(200, 153, 58, 0.2)";
      });
      if (opts.damage != null) {
        const recentPct = clamp(((opts.damage - value) / b.max) * 100, 0, 100);
        b.recent.style.height = recentPct + "%";
        b.recent.style[ b.reverse ? "top" : "bottom" ] = pct + "%";
        clearTimeout(b.recentTimer);
        b.recentTimer = setTimeout(() => { b.recent.style.height = "0%"; }, 600);
        b.el.classList.remove("shake");
        void b.el.offsetWidth;
        b.el.classList.add("shake");
      }
    }
  }

  buildBar("enemyFuryBar", "furia", FURY_MAX, true);
  buildBar("enemyManaBar", "mana", 6, true);
  buildBar("enemyHpBar", "hp", 40, true);
  buildBar("enemyStaminaBar", "estamina", ENEMY_STAMINA_MAX, true);
  buildBar("playerHpBar", "hp", 30, false);
  buildBar("playerStaminaBar", "estamina", 12, false);
  buildBar("playerManaBar", "mana", 10, false);

  function renderBars() {
    setBar("enemyFuryBar", state.enemyFury);
    setBar("enemyManaBar", state.enemyMana);
    setBar("enemyHpBar", state.enemyHp);
    setBar("enemyStaminaBar", state.enemyStamina);
    setBar("playerHpBar", state.playerHp);
    setBar("playerStaminaBar", state.playerStamina);
    setBar("playerManaBar", state.playerMana);
  }

  /* ================= NOVO — FÚRIA EM ARCO ================= */
  const furyArc = $("furyArc");
  const furyFill = $("furyFill");
  const furyChip = $("furyChip");
  const furyValue = $("furyValue");
  const furyTicks = $("furyTicks");

  (function buildFuryTicks() {
    for (let i = 0; i < FURY_MAX; i++) {
      const t = i / FURY_MAX;
      const a = (-90 + t * 180) * Math.PI / 180;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", 70 + 54 * Math.cos(a));
      line.setAttribute("y1", 70 + 54 * Math.sin(a));
      line.setAttribute("x2", 70 + 66 * Math.cos(a));
      line.setAttribute("y2", 70 + 66 * Math.sin(a));
      line.setAttribute("class", "fury-tick");
      furyTicks.appendChild(line);
    }
  })();

  function renderFury() {
    const v = clamp(state.playerFury, 0, FURY_MAX);
    const pct = (v / FURY_MAX) * 100;
    furyFill.style.strokeDasharray = pct + " 100";
    const a = (-90 + pct * 1.8) * Math.PI / 180;
    furyChip.style.left = (70 + 60 * Math.cos(a)) + "px";
    furyChip.style.top = (70 + 60 * Math.sin(a)) + "px";
    furyValue.textContent = Math.round(v);
    furyArc.classList.toggle("full", v >= FURY_MAX);
    furyChip.classList.toggle("full", v >= FURY_MAX);
    btnSpecial.disabled = !(state.phase === "player" && v >= FURY_MAX);
  }

  /* ================= HELPERS DE UI ================= */
  function showFlash(el) {
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
  }
  function hideFlash(el) { el.classList.remove("show"); }

  function showItemPopup(item, text) {
    const popup = $("itemPopup");
    $("popupIcon").firstElementChild.setAttribute("href", "#icon-" + item.icon);
    $("popupName").textContent = item.name;
    $("popupText").textContent = text;
    popup.className = "item-popup show branch-" + item.branch;
    clearTimeout(state.popupTimer);
    state.popupTimer = setTimeout(() => popup.classList.remove("show"), 1800);
  }

  function renderPending() {
    const wrap = $("pendingItems");
    wrap.innerHTML = "";
    state.pending.forEach((p) => {
      const chip = document.createElement("div");
      chip.className = "pending-chip branch-" + p.branch;
      chip.innerHTML =
        '<svg class="icon-svg" width="13" height="13"><use href="#icon-' + p.icon + '"/></svg>' +
        '<span class="pending-name">' + p.name + "</span>" +
        '<span class="pending-count">' + Math.max(0, p.activatesAtTurn - state.turn) + "</span>";
      wrap.appendChild(chip);
    });
  }

  function renderCrystalPips() {
    const wrap = $("crystalPips");
    wrap.innerHTML = "";
    for (let i = 0; i < CRYSTAL_MAX; i++) {
      wrap.insertAdjacentHTML("beforeend",
        '<svg class="icon-svg pip' + (i < state.crystals ? " full" : "") + '" width="16" height="16"><use href="#icon-gem"/></svg>');
    }
    $("bagCrystalCount").textContent = state.crystals;
  }

  function renderBag() {
    const list = $("bagList");
    list.innerHTML = "";
    ITEMS.forEach((item) => {
      const qty = state.itemsQty[item.id] || 0;
      if (qty <= 0) return;
      const canUse = state.crystals >= item.crystalCost;
      const row = document.createElement("div");
      row.className = "bag-item branch-" + item.branch;
      row.innerHTML =
        '<div class="bag-item-icon branch-' + item.branch + '">' +
        '<svg class="icon-svg" width="18" height="18"><use href="#icon-' + item.icon + '"/></svg></div>' +
        '<div class="bag-item-info">' +
        '<span class="bag-item-name">' + item.name + ' <span class="bag-qty">x' + qty + "</span></span>" +
        '<span class="bag-item-desc">' + item.desc + "</span>" +
        '<span class="bag-item-delay">ativa em ' + item.delay + " turno" + (item.delay > 1 ? "s" : "") + "</span></div>" +
        '<button class="bag-use"' + (canUse ? "" : " disabled") + ' data-item="' + item.id + '">' +
        '<svg class="icon-svg" width="12" height="12"><use href="#icon-gem"/></svg> ' + item.crystalCost + "</button>";
      list.appendChild(row);
    });
    if (!list.children.length) {
      list.innerHTML = '<p class="bag-empty" style="text-align:center;font-size:11px;color:var(--text-dim);padding:16px 0">Nenhum item na mochila.</p>';
    }
  }

  function updateTimer() {
    const pct = (state.timeLeft / MATCH_TIME) * 100;
    const fill = $("timerFill");
    fill.style.width = pct + "%";
    fill.classList.toggle("danger", pct <= 20);
  }

  function setPhase(p) {
    state.phase = p;
    $("btnAttack").disabled = p !== "player" || state.playerStamina < ATK_COST;
    $("btnDefend").disabled = p !== "player" || state.playerStamina < DEF_COST;
    $("btnSpecial").disabled = p !== "player" || state.playerFury < FURY_MAX;
    document.querySelectorAll("#skillRow .btn-action").forEach((b) => {
      b.disabled = p !== "player" || state.playerMana < SKILLS[b.dataset.skill].manaCost;
    });
    $("btnBag").disabled = p !== "player";
  }

  function refreshButtons() { setPhase(state.phase); }

  /* ================= DADO 3D ================= */
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const FACE_ROTATION = { 1: { x: 0, y: 0 }, 2: { x: -90, y: 0 }, 3: { x: 0, y: -90 }, 4: { x: 0, y: 90 }, 5: { x: 90, y: 0 }, 6: { x: 0, y: 180 } };
  const TILT_X = -22, TILT_Y = 28;
  const FACES = [["front", 1], ["back", 6], ["right", 3], ["left", 4], ["top", 2], ["bottom", 5]];

  (function buildDice() {
    const cube = $("diceCube");
    FACES.forEach(([name, value]) => {
      const face = document.createElement("div");
      face.className = "dice-face face-" + name;
      for (let i = 0; i < 9; i++) {
        const slot = document.createElement("div");
        slot.className = "pip-slot";
        if (PIPS[value].includes(i)) slot.innerHTML = '<span class="pip"></span>';
        face.appendChild(slot);
      }
      cube.appendChild(face);
    });
  })();

  let rolling = false;
  let rolled = false;

  function handleRoll() {
    if (rolling || rolled) return;
    rolling = true;
    const value = rollDie();
    state.luck = value;
    const cube = $("diceCube");
    const scene = $("diceScene");
    const shadow = $("diceShadow");
    const startX = Math.floor(Math.random() * 4) * 90;
    const startY = Math.floor(Math.random() * 4) * 90;
    const rot = FACE_ROTATION[value];
    cube.style.transition = "none";
    cube.style.transform = "rotateX(" + startX + "deg) rotateY(" + startY + "deg)";
    void cube.offsetHeight;
    cube.style.transition = "transform 2.4s cubic-bezier(0.15, 0.75, 0.3, 1)";
    cube.style.transform = "rotateX(" + (rot.x + TILT_X + 1080) + "deg) rotateY(" + (rot.y + TILT_Y + 720) + "deg)";
    scene.classList.add("throwing");
    shadow.classList.add("animating");
    $("btnRoll").disabled = true;
    setTimeout(() => {
      rolling = false;
      rolled = true;
      scene.classList.remove("throwing");
      shadow.classList.remove("animating");
      const label = $("luckLabel");
      label.textContent = "Sorte: " + state.luck;
      label.style.visibility = "visible";
      $("btnRoll").classList.add("hidden");
      $("btnStartBattle").classList.remove("hidden");
    }, 2400);
  }

  /* ================= BATALHA ================= */
  function chooseEnemyAction() {
    if (state.enemyFury >= FURY_MAX) return "special";
    const canAttack = state.enemyStamina >= ATK_COST;
    const canDefend = state.enemyStamina >= DEF_COST;
    if (canAttack && canDefend) return Math.random() < 0.3 ? "defend" : "attack";
    if (canAttack) return "attack";
    if (canDefend) return "defend";
    return "skip";
  }

  function resolveTurn(playerAction, skill) {
    setPhase("resolve");
    const enemyAction = chooseEnemyAction();
    const playerAttacks = playerAction === "attack" || playerAction === "special" || playerAction === "skill";
    const enemyAttacks = enemyAction === "attack" || enemyAction === "special";

    $("playerHolder").classList.toggle("attacking", playerAttacks);
    $("enemyWrap").classList.toggle("attacking", enemyAttacks);

    const delay = playerAttacks || enemyAttacks ? LUNGE : 300;

    setTimeout(() => {
      let playerDmg = 0, enemyDmg = 0;
      let playerMiss = false, enemyMiss = false, skillMiss = false;
      let skillHeal = 0, skillShield = 0, skillDrainStamina = 0;
      const playerSpecial = playerAction === "special";
      const enemySpecial = enemyAction === "special";

      if (skill) {
        const fx = skill.effect;
        if (fx.type === "damage") {
          if (Math.random() < missChance(state.luck)) skillMiss = true;
          else {
            let d = rollDamage(state.playerAtk, state.enemyDef) * fx.mult;
            if (enemyAction === "defend") d = d / 2;
            enemyDmg = d;
          }
          if (fx.drainStamina) skillDrainStamina = fx.drainStamina;
        } else if (fx.type === "shield") {
          skillShield = fx.base + Math.floor(state.playerDef * fx.defFactor);
        }
      }

      if (playerAction === "attack") {
        if (Math.random() < missChance(state.luck)) playerMiss = true;
        else {
          let d = rollDamage(state.playerAtk, state.enemyDef);
          if (enemyAction === "defend") d = d / 2;
          enemyDmg = d;
        }
      } else if (playerSpecial) {
        let d = rollDamage(state.playerAtk, state.enemyDef) * state.playerFuryMult;
        if (enemyAction === "defend") d = d / 2;
        enemyDmg = d;
      }

      if (enemyAction === "attack") {
        if (Math.random() < missChance(rollDie())) enemyMiss = true;
        else {
          let d = rollDamage(state.enemyAtk, state.playerDef);
          if (playerAction === "defend") d = d / 2;
          playerDmg = d;
        }
      } else if (enemySpecial) {
        let d = rollDamage(state.enemyAtk, state.playerDef) * ENEMY_SPECIAL_MULT;
        if (playerAction === "defend") d = d / 2;
        playerDmg = d;
      }

      let shieldLeft = state.playerShield;
      if (skill && skill.effect.type === "shield") shieldLeft = skillShield;
      if (playerDmg > 0 && shieldLeft > 0) {
        const absorbed = Math.min(shieldLeft, playerDmg);
        playerDmg -= absorbed;
        shieldLeft -= absorbed;
      }
      state.playerShield = shieldLeft;

      const oldEnemyHp = state.enemyHp;
      const oldPlayerHp = state.playerHp;
      state.enemyHp = Math.max(0, state.enemyHp - enemyDmg);
      state.playerHp = Math.max(0, Math.min(state.playerMaxHp, state.playerHp + skillHeal) - playerDmg);

      state.playerFury = playerSpecial ? 0 : clamp(state.playerFury + playerDmg * FURY_GAIN, 0, FURY_MAX);
      state.enemyFury = enemySpecial ? 0 : clamp(state.enemyFury + enemyDmg * FURY_GAIN - (skill && skill.effect.drainFury || 0), 0, FURY_MAX);

      state.playerStamina = Math.max(0, state.playerStamina - (playerAction === "attack" ? ATK_COST : playerAction === "defend" ? DEF_COST : 0));
      state.enemyStamina = Math.max(0, state.enemyStamina - (enemyAction === "attack" ? ATK_COST : enemyAction === "defend" ? DEF_COST : 0) - skillDrainStamina);
      if (skill) state.playerMana = Math.max(0, state.playerMana - skill.manaCost);

      renderBars();
      renderFury();
      setBar("playerHpBar", state.playerHp, { damage: oldPlayerHp });
      setBar("enemyHpBar", state.enemyHp, { damage: oldEnemyHp });

      if (playerAction === "defend") showFlash($("playerBlockFlash"));
      if (enemyAction === "defend") showFlash($("enemyBlockFlash"));
      if (playerMiss || skillMiss) showFlash($("playerMissFlash"));
      if (enemyMiss) showFlash($("enemyMissFlash"));
      if (playerSpecial && enemyDmg > 0) showFlash($("enemyCritFlash"));
      if (enemySpecial && playerDmg > 0) showFlash($("playerCritFlash"));
      if (skill && !skillMiss) {
        const sf = $("enemySkillFlash");
        sf.textContent = skill.name + "!";
        sf.className = "skill-flash left branch-" + skill.branch + " show";
      }
      if (state.playerShield > 0) {
        $("shieldBadge").classList.add("show");
        $("shieldValue").textContent = Math.ceil(state.playerShield);
      } else {
        $("shieldBadge").classList.remove("show");
      }

      setTimeout(() => {
        $("playerHolder").classList.remove("attacking");
        $("enemyWrap").classList.remove("attacking");
        ["playerBlockFlash", "enemyBlockFlash", "playerMissFlash", "enemyMissFlash", "playerCritFlash", "enemyCritFlash"].forEach((id) => hideFlash($(id)));
        hideFlash($("enemySkillFlash"));

        setTimeout(() => {
          const nextTurn = state.turn + 1;
          state.turn = nextTurn;
          if (nextTurn > 0 && nextTurn % CRYSTAL_REFILL_TURNS === 0) {
            state.crystals = CRYSTAL_MAX;
            renderCrystalPips();
          }

          let popup = null;
          const due = state.pending.filter((p) => p.activatesAtTurn <= nextTurn);
          state.pending = state.pending.filter((p) => p.activatesAtTurn > nextTurn);
          due.forEach((p) => {
            const item = ITEMS.find((i) => i.id === p.itemId);
            if (!item) return;
            const fx = item.effect;
            let text = "";
            if (fx.type === "damage") {
              const dmg = fx.base + Math.floor(state.difficulty / 2);
              state.enemyHp = Math.max(0, state.enemyHp - dmg);
              text = dmg + " de dano";
            } else if (fx.type === "heal") {
              const heal = Math.floor(state.playerMaxHp * fx.pct);
              state.playerHp = Math.min(state.playerMaxHp, state.playerHp + heal);
              text = "+" + heal + " de vida";
            } else if (fx.type === "mana") {
              state.playerMana = Math.min(state.playerManaMax, state.playerMana + fx.amount);
              text = "+" + fx.amount + " de mana";
            } else if (fx.type === "stamina") {
              state.playerStamina = Math.min(state.playerStaminaMax, state.playerStamina + fx.amount);
              text = "+" + fx.amount + " de estamina";
            } else if (fx.type === "fury") {
              state.playerFury = clamp(state.playerFury + fx.amount, 0, FURY_MAX);
              text = "+" + fx.amount + " de fúria";
            } else if (fx.type === "shield") {
              state.playerShield += fx.amount;
              text = "+" + fx.amount + " de escudo";
            }
            popup = item;
            popupText = text;
            showItemPopup(item, text);
          });

          renderBars();
          renderFury();
          renderPending();

          if (state.enemyHp <= 0) {
            const goldGain = rollReward(10, 6);
            const xpGain = rollReward(8, 5);
            $("rewardGold").textContent = "+" + goldGain;
            $("rewardXp").textContent = "+" + xpGain + " XP";
            $("victoryOverlay").classList.add("show");
            setPhase("victory");
          } else if (state.playerHp <= 0) {
            $("defeatTitle").textContent = "Derrota!";
            $("defeatOverlay").classList.add("show");
            setPhase("defeat");
          } else {
            setPhase("player");
            if (state.playerStamina < ATK_COST && state.playerStamina < DEF_COST && state.playerFury < FURY_MAX &&
                !Object.values(SKILLS).some((s) => state.playerMana >= s.manaCost)) {
              setTimeout(() => resolveTurn("skip"), 800);
            }
          }
        }, RETURN);
      }, HOLD);
    }, delay);
  }

  function handleAction(action, skill) {
    if (state.phase !== "player") return;
    if (action === "attack" && state.playerStamina < ATK_COST) return;
    if (action === "defend" && state.playerStamina < DEF_COST) return;
    if (action === "special" && state.playerFury < FURY_MAX) return;
    if (action === "skill" && (!skill || state.playerMana < skill.manaCost)) return;
    resolveTurn(action, skill);
  }

  /* ================= MOCHILA ================= */
  function useItemAction(item) {
    if (state.phase !== "player") return;
    if (state.crystals < item.crystalCost) return;
    if ((state.itemsQty[item.id] || 0) <= 0) return;
    state.itemsQty[item.id] -= 1;
    state.crystals -= item.crystalCost;
    state.pending.push({ itemId: item.id, name: item.name, icon: item.icon, branch: item.branch, activatesAtTurn: state.turn + item.delay });
    renderCrystalPips();
    renderPending();
    renderBag();
    closeBag();
  }

  /* ================= RESET / FLUXO ================= */
  function resetBattle(toDice) {
    state.turn = 0;
    state.luck = null;
    state.playerHp = state.playerMaxHp;
    state.playerStamina = state.playerStaminaMax;
    state.playerMana = state.playerManaMax;
    state.playerFury = 0;
    state.playerShield = 0;
    state.enemyHp = state.enemyMaxHp;
    state.enemyStamina = ENEMY_STAMINA_MAX;
    state.enemyMana = state.enemyManaMax;
    state.enemyFury = 0;
    state.crystals = CRYSTAL_MAX;
    state.timeLeft = MATCH_TIME;
    state.pending = [];
    ["pocao-mana", "pocao-estamina", "pocao-vida", "pocao-furia", "pocao-escudo", "bomba"].forEach((id) => (state.itemsQty[id] = 1));
    rolled = false;
    rolling = false;
    $("diceCube").style.transition = "none";
    $("diceCube").style.transform = "rotateX(0deg) rotateY(0deg)";
    $("luckLabel").style.visibility = "hidden";
    $("btnRoll").classList.remove("hidden");
    $("btnRoll").disabled = false;
    $("btnStartBattle").classList.add("hidden");
    $("diceOverlay").classList.toggle("hidden", !toDice);
    $("victoryOverlay").classList.remove("show");
    $("defeatOverlay").classList.remove("show");
    $("playerHolder").classList.remove("attacking");
    $("enemyWrap").classList.remove("attacking");
    $("shieldBadge").classList.remove("show");
    renderBars();
    renderFury();
    renderPending();
    renderCrystalPips();
    renderBag();
    updateTimer();
    setPhase(toDice ? "dice" : "player");
    if (!toDice) {
      $("diceOverlay").classList.add("hidden");
    }
  }

  function openBag() {
    if (state.phase !== "player") return;
    renderBag();
    renderCrystalPips();
    $("bagOverlay").classList.add("show");
  }
  function closeBag() { $("bagOverlay").classList.remove("show"); }

  /* ================= EVENTOS ================= */
  $("btnRoll").addEventListener("click", handleRoll);
  $("btnStartBattle").addEventListener("click", () => {
    $("diceOverlay").classList.add("hidden");
    setPhase("player");
  });
  $("btnAttack").addEventListener("click", () => handleAction("attack"));
  $("btnDefend").addEventListener("click", () => handleAction("defend"));
  $("btnSpecial").addEventListener("click", () => handleAction("special"));
  document.querySelectorAll("#skillRow .btn-action").forEach((b) => {
    b.addEventListener("click", () => handleAction("skill", SKILLS[b.dataset.skill]));
  });
  $("btnBag").addEventListener("click", openBag);
  $("btnBagClose").addEventListener("click", closeBag);
  $("bagList").addEventListener("click", (e) => {
    const btn = e.target.closest(".bag-use");
    if (!btn || btn.disabled) return;
    const item = ITEMS.find((i) => i.id === btn.dataset.item);
    useItemAction(item);
  });
  $("btnNextBattle").addEventListener("click", () => resetBattle(true));
  $("btnVictoryLeave").addEventListener("click", () => resetBattle(true));
  $("btnRetry").addEventListener("click", () => resetBattle(true));
  $("btnDefeatLeave").addEventListener("click", () => resetBattle(true));

  /* ================= LOOP DE TEMPO (timer + regen) ================= */
  let lastTick = Date.now();
  const progress = { stamina: 0, enemy: 0, mana: 0 };
  setInterval(() => {
    const now = Date.now();
    const dt = Math.min((now - lastTick) / 1000, 1);
    lastTick = now;

    if (state.phase === "player" || state.phase === "resolve") {
      state.timeLeft = Math.max(0, state.timeLeft - dt);
      updateTimer();
      if (state.timeLeft <= 0 && state.phase !== "defeat" && state.phase !== "victory") {
        $("defeatTitle").textContent = "Tempo esgotado!";
        $("defeatOverlay").classList.add("show");
        setPhase("defeat");
      }
    }

    progress.stamina += (dt * 1000) / 2000;
    let add = 0;
    while (progress.stamina >= 1) { progress.stamina -= 1; add++; }
    if (add > 0) state.playerStamina = Math.min(state.playerStaminaMax, state.playerStamina + add);

    progress.enemy += (dt * 1000) / 2000;
    add = 0;
    while (progress.enemy >= 1) { progress.enemy -= 1; add++; }
    if (add > 0) state.enemyStamina = Math.min(ENEMY_STAMINA_MAX, state.enemyStamina + add);

    progress.mana += (dt * 1000) / 4000;
    add = 0;
    while (progress.mana >= 1) { progress.mana -= 1; add++; }
    if (add > 0) state.playerMana = Math.min(state.playerManaMax, state.playerMana + add);

    renderBars();
    refreshButtons();
  }, 100);

  /* ================= INIT ================= */
  renderBars();
  renderFury();
  renderCrystalPips();
  updateTimer();
  setPhase("dice");
})();
</script>
</body>
</html>
